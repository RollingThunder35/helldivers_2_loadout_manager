name: Build and Release

on:
  push:
    tags:
      - 'V*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies and Rebuild Bootloader
      env:
        PYINSTALLER_COMPILE_BOOTLOADER: 1
      run: |
        python -m pip install --upgrade pip
        # Install CPU PyTorch packages
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        # Install remaining runtime requirements
        pip install -r requirements.txt
        # Recompile PyInstaller bootloader from C source on runner
        pip install --no-binary=pyinstaller --force-reinstall pyinstaller

    - name: Build Manager and Wizard
      run: |
        python build_manager.py
        python build_wizard.py

    - name: Scan Executables with Windows Defender
      shell: cmd
      run: |
        "C:\Program Files\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "%CD%\dist\SEAF_Loadout_Manager" || exit /b 1
        "C:\Program Files\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "%CD%\dist\SEAF_Setup_Wizard" || exit /b 1

    - name: Zip Manager Folder
      run: |
        Compress-Archive -Path dist/SEAF_Loadout_Manager -DestinationPath dist/SEAF_Loadout_Manager.zip
        Compress-Archive -Path dist/SEAF_Setup_Wizard -DestinationPath dist/SEAF_Setup_Wizard.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/SEAF_Loadout_Manager.zip
          dist/SEAF_Setup_Wizard.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true