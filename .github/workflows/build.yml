name: Build and Release

on:
  push:
    tags:
      - 'V*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@main
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Build Manager
        run: |
          python build_manager.py

      - name: Build Wizard
        run: |
          python build_wizard.py

      - name: Scan Executables with Windows Defender
        shell: cmd
        run: |
          "C:\Program Files\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "%CD%\build\SEAF_Loadout_Manager" || exit /b 1
          "C:\Program Files\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "%CD%\build\SEAF_Setup_Wizard" || exit /b 1

      - name: Extract Changelog Message
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_MSG=$(git tag -l --format='%(contents)' ${{ github.ref_name }})
          if [ -z "$TAG_MSG" ]; then
            PR_BODY=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].body' 2>/dev/null || true)
            if [ -n "$PR_BODY" ] && [ "$PR_BODY" != "null" ]; then
              TAG_MSG="$PR_BODY"
            else
              TAG_MSG=$(git log -1 --pretty=format:"%b")
              if [ -z "$TAG_MSG" ]; then
                TAG_MSG=$(git log -1 --pretty=format:"%s")
              fi
            fi
          fi
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Zip Manager Folder
        run: |
          Compress-Archive -Path build/SEAF_Loadout_Manager -DestinationPath build/SEAF_Loadout_Manager.zip
          Compress-Archive -Path build/SEAF_Setup_Wizard -DestinationPath build/SEAF_Setup_Wizard.zip

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3

        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/SEAF_Loadout_Manager.zip
            build/SEAF_Setup_Wizard.zip
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.message }}
          draft: false
          prerelease: false

      - name: Upload Manager to Nexus Mods
        uses: Nexus-Mods/upload-action@main
        if: steps.create_release.conclusion == 'success'
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ secrets.NEXUS_MOD_ID }}
          file_id: ${{ secrets.NEXUS_MANAGER_FILE_ID }}
          filename: SEAF_Loadout_Manager
          version: ${{ github.ref_name }}
          changelog: ${{ steps.changelog.outputs.message }}

      - name: Upload Wizard to Nexus Mods
        uses: Nexus-Mods/upload-action@main
        if: steps.create_release.conclusion == 'success'
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ secrets.NEXUS_MOD_ID }}
          file_id: ${{ secrets.NEXUS_WIZARD_FILE_ID }}
          filename: SEAF_Setup_Wizard
          version: ${{ github.ref_name }}
          changelog: ${{ steps.changelog.outputs.message }}